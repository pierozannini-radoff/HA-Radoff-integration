name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: "actions/setup-python@v5.1.1"
          with:
            python-version: "3.12"

        - name: "Install ruff"
          run: "pip install ruff==0.5.5"

        - name: "Run ruff format --check"
          run: "ruff format --check ."

        - name: "Run ruff check"
          run: "ruff check ."

  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: "actions/setup-python@v5.1.1"
          with:
            python-version: "3.12"

        - name: "Install dependencies"
          run: "pip install -r requirements.txt -r requirements-test.txt"

        - name: "Run pytest"
          # Dummy credentials so botocore's default credential chain
          # resolves immediately: without any credentials available it
          # falls through to a "login" provider that requires the optional
          # botocore[crt] extra and raises MissingDependencyException
          # before the test's AWSSRP mocking is ever reached.
          env:
            AWS_ACCESS_KEY_ID: "testing"
            AWS_SECRET_ACCESS_KEY: "testing"
            AWS_DEFAULT_REGION: "eu-west-1"
          run: "pytest"

  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"
            # Remove this 'ignore' key when you have added brand images for your integration to https://github.com/home-assistant/brands
            ignore: "brands"