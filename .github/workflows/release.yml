name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set manifest version from the release tag"
        shell: "bash"
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          manifest="${{ github.workspace }}/custom_components/radoff/manifest.json"
          jq --arg version "$version" '.version = $version' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/radoff"
          zip radoff.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: "softprops/action-gh-release@v2.0.8"
        with:
          files: ${{ github.workspace }}/custom_components/radoff/radoff.zip