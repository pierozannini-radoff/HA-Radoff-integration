# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py312"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
# Manual API probe script, not shipped code: it lives outside custom_components/,
# is run by hand against the real backend, and printing to stdout is its purpose.
# Narrow this list if the script is ever promoted to a maintained dev tool.
"probe_domain_discovery.py" = ["ALL"]

# api/client.py sits one level inside the `api/` package (S-06b) and needs to
# reach `const.py` and `properties.py` in the parent `custom_components/radoff/`
# package. Every intra-integration import in this codebase is relative, never
# absolute (`custom_components.radoff...` does not resolve the same way under
# HACS and under the dev harness's PYTHONPATH, see scripts/develop) - TID252
# would otherwise forbid the only import form that works in both.
"custom_components/radoff/api/client.py" = ["TID252"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25