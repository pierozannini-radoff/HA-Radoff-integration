# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py312"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
# One-shot scripts, run by hand against a real backend: not shipped code, and
# printing to stdout is their purpose.
"probe_arch2.py" = ["ALL"]
"ha_registry_snapshot.py" = ["ALL"]
"verify_m03_live.py" = ["ALL"]
"verify_m04_live.py" = ["ALL"]
"verify_m05_live.py" = ["ALL"]
"verify_m06_live.py" = ["ALL"]
"verify_m07_live.py" = ["ALL"]

# Test suite: pytest's own conventions, not this file's library-code bar.
"tests/*.py" = ["ALL"]

# Intra-integration imports are relative, never absolute: an absolute one does
# not resolve the same way under HACS and under the dev harness.
"custom_components/radoff/api/client.py" = ["TID252"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25