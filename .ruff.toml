# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py312"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
# Manual API probe scripts, not shipped code: they live outside
# custom_components/, are run by hand against the real backend, and
# printing to stdout / prompting interactively is their purpose.
"probe_domain_discovery.py" = ["ALL"]

"probe_reading_timestamp.py" = ["ALL"]

# Manual log-diagnostic script (S-08 follow-up): inspects a Home Assistant
# log by hand to check the auth-error/re-auth and natural-token-expiry
# timing described in api/auth.py's docstring. Not shipped code, same
# convention as the other dev/probe/verify scripts in this list - printing
# to stdout is its entire purpose.
"check_reauth_log.py" = ["ALL"]

# Standalone verification scripts (S-06, S-07, S-08, S-09, S-10, S-11): run
# by hand with `python3 verify_sXX.py`, not shipped code, and deliberately
# monkeypatch/stub homeassistant modules and private attributes to exercise
# the integration without a real HA install.
"verify_s07.py" = ["ALL"]
"verify_s08.py" = ["ALL"]
"verify_s09.py" = ["ALL"]
"verify_s10.py" = ["ALL"]
"verify_s11.py" = ["ALL"]

# Temporary dev launcher (S-07): a drop-in replacement for
# ./scripts/develop that monkeypatches API.get_devices to simulate poll
# faults (missing device / missing property) for manual AC1/AC2 testing
# with a single real device. Not shipped code - see its own docstring for
# the removal note (delete once S-18 lands automated degraded-poll tests).
"dev_fault_injection.py" = ["ALL"]

# Automated wrapper around dev_fault_injection.py (S-07): drives it as a
# subprocess, polls the REST API, and prints a PASS/FAIL verdict for AC1/AC2
# instead of requiring you to watch the log or the Developer Tools UI by
# hand. Not shipped code, same convention as the other dev/probe scripts.
"verify_fault_injection.py" = ["ALL"]

# Full AC1-AC4 suite (S-07) against two real devices in one continuous HA
# run, driving dev_fault_injection.py's dynamic fault_control.json. Not
# shipped code, same convention as the other dev/probe scripts.
"verify_ac_suite.py" = ["ALL"]

# Test suite (S-08 AC2/AC3/AC4): pytest-homeassistant-custom-component
# fixtures and test bodies follow pytest's own conventions (module-level
# constants, no docstring on every helper, `hass`/`entry` as loosely-typed
# fixture params, etc.), not this file's "ship-quality library code" bar -
# same reasoning as the other non-shipped dev/verify scripts above.
"tests/*.py" = ["ALL"]

# api/client.py sits one level inside the `api/` package (S-06b) and needs to
# reach `const.py` and `properties.py` in the parent `custom_components/radoff/`
# package. Every intra-integration import in this codebase is relative, never
# absolute (`custom_components.radoff...` does not resolve the same way under
# HACS and under the dev harness's PYTHONPATH, see scripts/develop) - TID252
# would otherwise forbid the only import form that works in both.
"custom_components/radoff/api/client.py" = ["TID252"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25